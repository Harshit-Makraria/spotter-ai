## Keeps the free-tier API awake.
##
## Render spins a free web service down after 15 minutes with no traffic, and
## waking it takes roughly 50 seconds. Since this app is reviewed by people
## opening a link cold, that first impression matters, so a scheduled ping keeps
## the service resident.
##
## Set the repository variable API_URL to the Render base URL, e.g.
##   Settings -> Secrets and variables -> Actions -> Variables -> New variable
##   Name: API_URL   Value: https://spotter-ai-api.onrender.com
##
## GitHub may delay scheduled runs on a busy shared queue, so the interval is
## deliberately shorter than the 15-minute timeout to absorb that slack.

name: Keep API warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # lets you trigger it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the health endpoint
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "API_URL repository variable is not set; nothing to ping."
            exit 0
          fi

          # --max-time covers a cold start, which can take ~50s to answer.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 \
                  "${API_URL%/}/api/health/" || echo "000")

          echo "GET ${API_URL%/}/api/health/ -> $code"

          # A sleeping service still counts as woken even if it answers slowly,
          # so only a genuine failure to respond is worth failing the job over.
          if [ "$code" = "000" ]; then
            echo "::warning::No response from the API."
            exit 1
          fi
