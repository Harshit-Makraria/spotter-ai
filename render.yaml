# Render blueprint: Django API + Postgres, both on the free tier.
services:
  - type: web
    name: eld-trip-planner-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: bash ./build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 60
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: eld-trip-planner-db
          property: connectionString
      # Set this to the deployed Vercel URL after the first frontend deploy.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Free key from https://openrouteservice.org — optional, OSRM is the fallback.
      - key: ORS_API_KEY
        sync: false

databases:
  - name: eld-trip-planner-db
    plan: free
    databaseName: eld
